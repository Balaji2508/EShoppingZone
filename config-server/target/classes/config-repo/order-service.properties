server.port=8084
spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/eshopping_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Downstream Service URLs
app.services.cart-service-url=http://localhost:8083
app.services.product-service-url=http://localhost:8082
app.services.payment-service-url=http://localhost:8087
app.services.wallet-service-url=http://localhost:8085
app.services.notification-service-url=http://localhost:8086

# RabbitMQ Order Queue Definitions
app.rabbitmq.exchange=eshopping.order.exchange
app.rabbitmq.queue=eshopping.order.status.queue
app.rabbitmq.routing-key=order.status.changed

# Resilience4j Circuit Breaker Centralized Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Service-Specific Circuit Breaker Instances
resilience4j.circuitbreaker.instances.productService.base-config=default
resilience4j.circuitbreaker.instances.cartService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.base-config=default
resilience4j.circuitbreaker.instances.walletService.base-config=default
resilience4j.circuitbreaker.instances.notificationService.base-config=default
